apiVersion: v1
kind: Service
metadata:
  name: hermes-pool-headless
  labels:
    app.kubernetes.io/name: hermes
    app.kubernetes.io/component: runtime-pool
spec:
  clusterIP: None
  publishNotReadyAddresses: false
  selector:
    app.kubernetes.io/name: hermes
    app.kubernetes.io/component: runtime-pool
  ports:
    - name: backend
      port: 9119
      targetPort: backend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: hermes-pool
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes
      app.kubernetes.io/component: runtime-pool
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hermes-pool
  labels:
    app.kubernetes.io/name: hermes
    app.kubernetes.io/component: runtime-pool
spec:
  serviceName: hermes-pool-headless
  replicas: 3
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes
      app.kubernetes.io/component: runtime-pool
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes
        app.kubernetes.io/component: runtime-pool
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: hermes
              app.kubernetes.io/component: runtime-pool
      containers:
        - name: hermes
          # Build deploy/image/Dockerfile and replace this with an immutable digest in production.
          image: hermes-sdk-runtime:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: hermes-runtime-env
          env:
            - name: HERMES_HOME
              value: /opt/data
          ports:
            - name: backend
              containerPort: 9119
              protocol: TCP
          startupProbe:
            httpGet:
              path: /api/health
              port: backend
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: backend
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: backend
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: shared-memory
              mountPath: /dev/shm
      volumes:
        - name: shared-memory
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hermes-pool-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hermes
      app.kubernetes.io/component: runtime-pool
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: hermes-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: hermes-sdk-control-plane
      ports:
        - protocol: TCP
          port: 9119

