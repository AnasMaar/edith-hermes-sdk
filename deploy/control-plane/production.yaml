apiVersion: v1
kind: Namespace
metadata:
  name: hermes-system
  labels:
    kubernetes.io/metadata.name: hermes-system
---
apiVersion: v1
kind: Namespace
metadata:
  name: hermes-runtimes
  labels:
    kubernetes.io/metadata.name: hermes-runtimes
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: edith-hermes-control-plane
  namespace: hermes-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hermes-runtime
  namespace: hermes-runtimes
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: edith-hermes-runtime-reconciler
  namespace: hermes-runtimes
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "persistentvolumeclaims", "secrets"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/status", "deployments/scale", "statefulsets", "statefulsets/status", "statefulsets/scale"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: edith-hermes-runtime-reconciler
  namespace: hermes-runtimes
subjects:
  - kind: ServiceAccount
    name: edith-hermes-control-plane
    namespace: hermes-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: edith-hermes-runtime-reconciler
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: edith-hermes-control-plane
  namespace: hermes-system
data:
  EDITH_OIDC_AUDIENCE: edith-hermes-control-plane
  EDITH_RUNTIME_NAMESPACE: hermes-runtimes
  EDITH_RUNTIME_SERVICE_ACCOUNT: hermes-runtime
  EDITH_RUNTIME_BRIDGE_IMAGE: ghcr.io/anasmaar/edith-hermes-runtime-bridge:v0.2.0
  EDITH_BUILDKIT_ADDRESS: tcp://buildkit.hermes-system.svc:1234
  EDITH_REQUIRE_DIGEST_PINNED_BASE: "true"
  EDITH_REQUIRE_IMAGE_SCAN: "true"
  EDITH_REQUIRE_IMAGE_SIGNATURE: "true"
  EDITH_ALLOWED_BASE_REPOSITORIES: nousresearch/hermes-agent
  EDITH_DEFAULT_STORAGE_SIZE: 5Gi
  EDITH_WORKER_CONCURRENCY: "4"
  # Replace with the internal HTTPS origin reachable by runtime pods.
  EDITH_PUBLIC_BASE_URL: https://edith-hermes-control-plane.example.com
  # Replace with the issuer used by your deployment.
  EDITH_OIDC_ISSUER: https://identity.example.com/
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edith-hermes-control-plane
  namespace: hermes-system
  labels:
    app.kubernetes.io/name: edith-hermes-control-plane
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      app.kubernetes.io/name: edith-hermes-control-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: edith-hermes-control-plane
    spec:
      serviceAccountName: edith-hermes-control-plane
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        fsGroup: 10000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: control-plane
          image: ghcr.io/anasmaar/edith-hermes-control-plane:v0.2.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: {name: edith-hermes-control-plane}
            - secretRef: {name: edith-hermes-control-plane-secrets}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 30
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "2", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: registry-auth, mountPath: /home/edith/.docker, readOnly: true}
            - {name: callback-secrets, mountPath: /var/run/secrets/edith-callback, readOnly: true}
            - {name: build-secrets, mountPath: /var/run/secrets/edith-build, readOnly: true}
      volumes:
        - name: registry-auth
          secret:
            secretName: registry-auth
            optional: false
        - name: callback-secrets
          secret:
            secretName: edith-callback-secrets
            optional: true
        - name: build-secrets
          secret:
            secretName: edith-build-secrets
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: edith-hermes-control-plane
  namespace: hermes-system
spec:
  selector:
    app.kubernetes.io/name: edith-hermes-control-plane
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: edith-hermes-control-plane
  namespace: hermes-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: edith-hermes-control-plane
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: buildkit
  namespace: hermes-system
spec:
  serviceName: buildkit
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: buildkit}
  template:
    metadata:
      labels: {app.kubernetes.io/name: buildkit}
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: buildkit
          image: moby/buildkit:v0.24.0-rootless
          args: ["--addr", "tcp://0.0.0.0:1234", "--oci-worker-no-process-sandbox"]
          ports:
            - {name: buildkit, containerPort: 1234}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            seccompProfile: {type: Unconfined}
            appArmorProfile: {type: Unconfined}
          resources:
            requests: {cpu: "1", memory: 1Gi}
            limits: {cpu: "4", memory: 8Gi}
          volumeMounts:
            - {name: state, mountPath: /home/user/.local/share/buildkit}
  volumeClaimTemplates:
    - metadata: {name: state}
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 50Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: buildkit
  namespace: hermes-system
spec:
  selector: {app.kubernetes.io/name: buildkit}
  ports:
    - {name: buildkit, port: 1234, targetPort: buildkit}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: buildkit-only-from-control-plane
  namespace: hermes-system
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: buildkit}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: edith-hermes-control-plane
      ports:
        - {protocol: TCP, port: 1234}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hermes-runtime-ingress
  namespace: hermes-runtimes
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: hermes}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: hermes-system}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: edith-hermes-control-plane
      ports:
        - {protocol: TCP, port: 8081}
