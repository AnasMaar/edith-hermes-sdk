apiVersion: v1
kind: Secret
metadata:
  name: edith-hermes-control-plane-secrets
  namespace: hermes-system
type: Opaque
stringData:
  EDITH_DATABASE_URL: postgresql+asyncpg://USER:PASSWORD@POSTGRES_HOST:5432/edith_hermes
  # Prefer a cloud KMS URI backed by workload identity, e.g. awskms://, gcpkms:// or azurekms://.
  EDITH_COSIGN_KEY: REPLACE_WITH_KMS_URI
  EDITH_INFERENCE_API_KEY: REPLACE_WITH_NOUS_INFERENCE_KEY
  # Optional adapter endpoint and service credential for Nous Portal/cloud lifecycle calls.
  EDITH_CLOUD_INVOKE_URL: https://cloud-adapter.example.com/invoke
  EDITH_CLOUD_BEARER_TOKEN: REPLACE_WITH_CLOUD_ADAPTER_TOKEN
---
# Replace this example with an ExternalSecret, SealedSecret, or your cloud secret manager.
apiVersion: v1
kind: Secret
metadata:
  name: registry-auth
  namespace: hermes-system
type: Opaque
stringData:
  config.json: '{"auths":{"registry.example.com":{"auth":"REPLACE_ME"}}}'
