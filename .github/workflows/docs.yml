name: Documentation

on:
  pull_request:
    paths:
      - "docs/**"
      - "examples/**"
      - "src/**"
      - "scripts/generate_api_reference.py"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "README.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "CHANGELOG.md"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "examples/**"
      - "src/**"
      - "scripts/generate_api_reference.py"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "README.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "CHANGELOG.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen --group dev --group docs
      - name: Check source references and runnable examples
        run: |
          uv run python scripts/generate_api_reference.py --check
          uv run pytest tests/test_documentation.py tests/test_documented_examples.py
      - name: Build with strict link and API validation
        run: uv run mkdocs build --strict
      - uses: actions/upload-artifact@v4
        with:
          name: hermes-sdk-documentation
          path: site/
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && vars.DOCS_PAGES_ENABLED == 'true'
        with:
          path: site/

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DOCS_PAGES_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy checked documentation to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
