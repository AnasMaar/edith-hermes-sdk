name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published GitHub release tag (for example v0.35.0)
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: Download and verify the published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid release tag'; exit 1; }
          version="${RELEASE_TAG#v}"
          wheel="edith_hermes_sdk-${version}-py3-none-any.whl"
          sdist="edith_hermes_sdk-${version}.tar.gz"
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease --jq 'if .isDraft or .isPrerelease then error("Release must be published and stable") else empty end'
          mkdir release-assets
          gh release download "$RELEASE_TAG" --dir release-assets --pattern "$wheel" --pattern "$sdist" --pattern "$wheel.sigstore.json" --pattern "$sdist.sigstore.json" --pattern SHA256SUMS
          cd release-assets
          diff -u <(printf '%s\n' "$wheel" "$sdist" | LC_ALL=C sort) <(awk '{print $2}' SHA256SUMS | LC_ALL=C sort)
          sha256sum --check --strict SHA256SUMS
          for file in "$wheel" "$sdist"; do
            uvx --from 'sigstore==4.5.1' sigstore verify identity --bundle "$file.sigstore.json" --cert-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${RELEASE_TAG}" --cert-oidc-issuer https://token.actions.githubusercontent.com "$file"
          done
          cd ..
          python scripts/prepare_pypi_upload.py "$RELEASE_TAG" release-assets pypi-upload
          if compgen -G 'pypi-upload/*' > /dev/null; then
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'needed=false' >> "$GITHUB_OUTPUT"
          fi
        id: prepare
      - name: Publish verified files to PyPI
        if: steps.prepare.outputs.needed == 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: pypi-upload/
