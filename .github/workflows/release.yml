name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --group dev --group docs
      - name: Check release tag matches package version
        run: uv run python scripts/check_release_tag.py "$GITHUB_REF_NAME"
      - name: Check license prerequisites
        run: uv run python scripts/check_release_license.py
      - run: uv run pytest
      - run: uv run ruff check .
      - run: uv run mypy src/edith_hermes src/edith_hermes_rpc
      - run: uv run mypy --ignore-missing-imports services/control_plane/edith_hermes_control_plane services/runtime_bridge/edith_hermes_runtime_bridge
      - run: uv run python scripts/validate_contracts.py
      - name: Check generated SDK
        run: |
          uv run python scripts/generate_sdk.py
          git diff --exit-code -- src/edith_hermes/generated
      - run: uv run --frozen --group docs python scripts/generate_api_reference.py --check
      - run: uv run --frozen --group docs mkdocs build --strict
      - run: uv build
      - run: uv run python scripts/verify_release_artifacts.py dist "$GITHUB_REF_NAME" --require-license
      - run: uv run twine check --strict dist/*.whl dist/*.tar.gz
      - name: Smoke test the built wheel
        run: |
          uv venv /tmp/sdk-wheel-smoke
          uv pip install --python /tmp/sdk-wheel-smoke/bin/python dist/*.whl
          cd /tmp
          /tmp/sdk-wheel-smoke/bin/python -c 'import edith_hermes, edith_hermes_rpc; print(edith_hermes.__version__)'
      - run: cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdk-release-distributions
          path: dist/
          if-no-files-found: error

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sdk-release-distributions
          path: dist
      - run: cd dist && sha256sum --check --strict SHA256SUMS
      - uses: sigstore/gh-action-sigstore-python@v3.4.0
        with:
          inputs: |
            dist/*.whl
            dist/*.tar.gz
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          overwrite_files: false
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.sigstore.json
            dist/SHA256SUMS

  container:
    needs: verify
    if: vars.PUBLISH_GHCR_IMAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: edith-hermes-mock
            file: services/mock_server/Dockerfile
          - image: edith-hermes-control-plane
            file: services/control_plane/Dockerfile
          - image: edith-hermes-runtime-bridge
            file: services/runtime_bridge/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: ghcr.io/anasmaar/${{ matrix.image }}:${{ github.ref_name }}
          provenance: true
          sbom: true
