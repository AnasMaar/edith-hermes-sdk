[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "edith-hermes-sdk"
version = "0.35.0"
description = "Python SDK for building, provisioning, and controlling Hermes runtimes"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md", "src/edith_hermes/licenses/LICENSE.hermes-agent.txt"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "typing-extensions>=4.12,<5",
]

[project.urls]
Documentation = "https://anasmaar.github.io/edith-hermes-sdk/"
Source = "https://github.com/AnasMaar/edith-hermes-sdk"
Issues = "https://github.com/AnasMaar/edith-hermes-sdk/issues"

[project.optional-dependencies]
streaming = ["websockets>=14,<16"]
embedded = [
  "docker>=7.1,<8",
  "kubernetes-asyncio>=31,<34",
]
control-plane = [
  "aiosqlite>=0.20,<1",
  "asyncpg>=0.29,<1",
  "docker>=7.1,<8",
  "fastapi>=0.115,<1",
  "kubernetes-asyncio>=31,<34",
  "pyjwt[crypto]>=2.9,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
  "websockets>=14,<16",
]

[dependency-groups]
docs = [
  "mkdocs-material>=9.6,<10",
  "mkdocstrings[python]>=0.30,<2",
]
dev = [
  "build>=1.2,<2",
  "aiosqlite>=0.20,<1",
  "asyncpg>=0.29,<1",
  "fastapi>=0.115,<1",
  "kubernetes-asyncio>=31,<34",
  "mypy>=1.11,<2",
  "pyjwt[crypto]>=2.9,<3",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pyyaml>=6,<7",
  "respx>=0.21,<1",
  "ruff>=0.8,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn>=0.32,<1",
  "websockets>=14,<16",
]

[tool.hatch.build.targets.wheel]
packages = [
  "src/edith_hermes",
  "src/edith_hermes_rpc",
  "services/control_plane/edith_hermes_control_plane",
]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["src/edith_hermes/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["edith_hermes"]

[[tool.mypy.overrides]]
module = ["docker", "kubernetes_asyncio", "kubernetes_asyncio.*"]
ignore_missing_imports = true
