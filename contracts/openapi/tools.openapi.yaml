openapi: 3.1.0
info:
  title: Hermes SDK Tool Extension API
  version: 0.1.0
  summary: Register tools and attach them to Hermes instances, profiles or sessions.
  description: |
    SDK-owned tool registry and binding contract. Bindings may materialize as Hermes MCP server
    configuration plus mcp.reload/tools.configure calls, or as an SDK callback tool bridge.
servers:
  - url: https://{toolPlaneHost}
    variables:
      toolPlaneHost: { default: hermes-tools.example.com }
security:
  - {}
  - bearerAuth: []
tags:
  - name: Tool Bundles
  - name: Bindings
  - name: MCP Servers
  - name: Tool Execution
paths:
  /v1/tool-bundles:
    get:
      tags: [Tool Bundles]
      operationId: listToolBundles
      responses:
        '200':
          description: Registered bundles.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties: { items: { type: array, items: { $ref: '#/components/schemas/ToolBundle' } } }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Tool Bundles]
      operationId: createToolBundle
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateToolBundleRequest' }
      responses:
        '201':
          description: Bundle created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ToolBundle' }
        default: { $ref: '#/components/responses/Error' }
  /v1/tool-bundles/{bundleId}:
    get:
      tags: [Tool Bundles]
      operationId: getToolBundle
      parameters: [{ $ref: '#/components/parameters/BundleId' }]
      responses:
        '200':
          description: Bundle.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ToolBundle' }
        default: { $ref: '#/components/responses/Error' }
    put:
      tags: [Tool Bundles]
      operationId: replaceToolBundle
      parameters: [{ $ref: '#/components/parameters/BundleId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateToolBundleRequest' }
      responses:
        '200':
          description: Updated bundle.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ToolBundle' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [Tool Bundles]
      operationId: deleteToolBundle
      parameters: [{ $ref: '#/components/parameters/BundleId' }]
      responses:
        '204': { description: Bundle deleted. }
        default: { $ref: '#/components/responses/Error' }
  /v1/tool-bindings:
    get:
      tags: [Bindings]
      operationId: listToolBindings
      parameters:
        - name: instanceId
          in: query
          schema: { type: string }
        - name: profileId
          in: query
          schema: { type: string }
        - name: sessionId
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Matching bindings.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties: { items: { type: array, items: { $ref: '#/components/schemas/ToolBinding' } } }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Bindings]
      operationId: createToolBinding
      summary: Attach a tool bundle to an instance, profile or session.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateToolBindingRequest' }
      responses:
        '201':
          description: Binding created and reconciled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ToolBinding' }
        default: { $ref: '#/components/responses/Error' }
  /v1/tool-bindings/{bindingId}:
    get:
      tags: [Bindings]
      operationId: getToolBinding
      parameters: [{ $ref: '#/components/parameters/BindingId' }]
      responses:
        '200':
          description: Binding and reconciliation state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ToolBinding' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [Bindings]
      operationId: deleteToolBinding
      parameters: [{ $ref: '#/components/parameters/BindingId' }]
      responses:
        '204': { description: Tools detached and binding deleted. }
        default: { $ref: '#/components/responses/Error' }
  /v1/mcp-servers:
    get:
      tags: [MCP Servers]
      operationId: listMcpServers
      responses:
        '200':
          description: MCP server registrations.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties: { items: { type: array, items: { $ref: '#/components/schemas/McpServer' } } }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [MCP Servers]
      operationId: createMcpServer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMcpServerRequest' }
      responses:
        '201':
          description: MCP server registered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/McpServer' }
        default: { $ref: '#/components/responses/Error' }
  /v1/mcp-servers/{serverId}:
    get:
      tags: [MCP Servers]
      operationId: getMcpServer
      parameters: [{ $ref: '#/components/parameters/ServerId' }]
      responses:
        '200':
          description: MCP server.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/McpServer' }
        default: { $ref: '#/components/responses/Error' }
    put:
      tags: [MCP Servers]
      operationId: replaceMcpServer
      parameters: [{ $ref: '#/components/parameters/ServerId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMcpServerRequest' }
      responses:
        '200':
          description: MCP server updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/McpServer' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [MCP Servers]
      operationId: deleteMcpServer
      parameters: [{ $ref: '#/components/parameters/ServerId' }]
      responses:
        '204': { description: MCP registration deleted. }
        default: { $ref: '#/components/responses/Error' }
  /v1/mcp-servers/{serverId}/actions:
    post:
      tags: [MCP Servers]
      operationId: actOnMcpServer
      parameters: [{ $ref: '#/components/parameters/ServerId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: { enum: [test, reload, begin_oauth, poll_oauth, complete_oauth, cancel_oauth] }
                bindingId: { type: string, description: "Select a profile binding when the server has multiple bindings." }
                sessionId: { type: string, description: "OAuth flow ID returned by begin_oauth; required for poll/complete/cancel." }
                clientRedirectUri: { type: string, format: uri }
                code: { type: string }
                state: { type: string }
                error: { type: string }
                issuer: { type: string }
      responses:
        '200':
          description: Test or OAuth initiation result.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '202': { description: Reload accepted. }
        default: { $ref: '#/components/responses/Error' }
  /v1/tool-calls:
    post:
      tags: [Tool Execution]
      operationId: executeToolCall
      summary: Callback endpoint implemented by an SDK user's tool host.
      description: |
        This operation is the callback contract. The SDK control plane calls the URL configured
        by a callback bundle; it is not an instruction to execute untrusted tools in the control
        plane itself.
      security:
        - callbackSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ToolCallRequest' }
      responses:
        '200':
          description: Tool result returned to Hermes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ToolCallResult' }
        default: { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    callbackSignature: { type: apiKey, in: header, name: X-Hermes-Signature }
  parameters:
    BundleId: { name: bundleId, in: path, required: true, schema: { type: string } }
    BindingId: { name: bindingId, in: path, required: true, schema: { type: string } }
    ServerId: { name: serverId, in: path, required: true, schema: { type: string } }
  responses:
    Error:
      description: Request failed.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    ToolDefinition:
      type: object
      required: [name, description, inputSchema]
      properties:
        name: { type: string, pattern: '^[A-Za-z0-9_.-]+$' }
        description: { type: string }
        inputSchema:
          type: object
          description: JSON Schema describing tool arguments.
          additionalProperties: true
        outputSchema:
          type: object
          additionalProperties: true
        annotations: { type: object, additionalProperties: true }
    ToolBundle:
      type: object
      required: [id, name, transport, tools, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        transport: { enum: [callback, mcp] }
        callback:
          $ref: '#/components/schemas/CallbackTransport'
        mcpServerId: { type: string }
        tools: { type: array, items: { $ref: '#/components/schemas/ToolDefinition' } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateToolBundleRequest:
      type: object
      required: [name, transport]
      properties:
        name: { type: string }
        description: { type: string }
        transport: { enum: [callback, mcp] }
        callback: { $ref: '#/components/schemas/CallbackTransport' }
        mcpServerId: { type: string }
        tools: { type: array, items: { $ref: '#/components/schemas/ToolDefinition' } }
      allOf:
        - if: { properties: { transport: { const: callback } } }
          then: { required: [callback, tools] }
        - if: { properties: { transport: { const: mcp } } }
          then: { required: [mcpServerId] }
    CallbackTransport:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri }
        timeoutSeconds: { type: integer, minimum: 1, maximum: 600, default: 60 }
        secretRef: { type: string, description: "Opaque secret-manager reference; never a raw secret." }
    BindingScope:
      oneOf:
        - type: object
          required: [level, instanceId]
          additionalProperties: false
          properties:
            level: { const: instance }
            instanceId: { type: string }
        - type: object
          required: [level, instanceId, profileId]
          additionalProperties: false
          properties:
            level: { const: profile }
            instanceId: { type: string }
            profileId: { type: string }
        - type: object
          required: [level, instanceId, profileId, sessionId]
          additionalProperties: false
          properties:
            level: { const: session }
            instanceId: { type: string }
            profileId: { type: string }
            sessionId: { type: string }
    CreateToolBindingRequest:
      type: object
      required: [bundleId, scope]
      properties:
        bundleId: { type: string }
        scope: { $ref: '#/components/schemas/BindingScope' }
        enabledTools: { type: array, items: { type: string } }
        approvalPolicy: { enum: [always, on_dangerous, never], default: on_dangerous }
        priority: { type: integer, default: 0 }
    ToolBinding:
      allOf:
        - $ref: '#/components/schemas/CreateToolBindingRequest'
        - type: object
          required: [id, status, createdAt]
          properties:
            id: { type: string }
            status: { enum: [pending, active, degraded, failed] }
            nativeServerName:
              type: string
              readOnly: true
              description: Native MCP registration name; retained for existing bindings and kept short for tool discovery.
            nativeState:
              type: object
              description: Result of MCP registration/reload/tools.configure reconciliation.
              additionalProperties: true
            error: { type: string }
            createdAt: { type: string, format: date-time }
    McpServer:
      allOf:
        - $ref: '#/components/schemas/CreateMcpServerRequest'
        - type: object
          required: [id, status, createdAt]
          properties:
            id: { type: string }
            status: { enum: [unknown, connecting, ready, needs_auth, failed] }
            discoveredTools: { type: array, items: { $ref: '#/components/schemas/ToolDefinition' } }
            createdAt: { type: string, format: date-time }
    CreateMcpServerRequest:
      type: object
      required: [name, transport]
      properties:
        name: { type: string }
        transport: { enum: [stdio, streamable_http, sse] }
        command: { type: string }
        args: { type: array, items: { type: string } }
        url: { type: string, format: uri }
        headers: { type: object, additionalProperties: { type: string } }
        auth: { enum: [oauth], description: "Use native Hermes MCP OAuth authentication." }
        environment: { type: object, additionalProperties: { type: string } }
        secretRefs: { type: object, additionalProperties: { type: string } }
      allOf:
        - if: { properties: { transport: { const: stdio } } }
          then: { required: [command] }
        - if: { properties: { transport: { enum: [streamable_http, sse] } } }
          then: { required: [url] }
    ToolCallRequest:
      type: object
      required: [callId, tool, arguments, target]
      properties:
        callId: { type: string }
        tool: { type: string }
        arguments: { type: object, additionalProperties: true }
        target: { $ref: '#/components/schemas/BindingScope' }
        deadline: { type: string, format: date-time }
        metadata: { type: object, additionalProperties: true }
    ToolCallResult:
      type: object
      required: [callId, isError, content]
      properties:
        callId: { type: string }
        isError: { type: boolean }
        content:
          type: array
          items:
            type: object
            required: [type]
            properties:
              type: { enum: [text, image, resource, json] }
              text: { type: string }
              data: true
        structuredContent: true
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        traceId: { type: string }
